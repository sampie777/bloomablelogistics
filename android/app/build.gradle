apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

import com.android.build.OutputFile
import groovy.json.JsonSlurper

/* https://stackoverflow.com/a/39026727/2806723 */
def getNpmVersion() {
    def inputFile = new File("../package.json")
    def packageJson = new JsonSlurper().parseText(inputFile.text)
    return packageJson["version"]
}

/* calculated from git commits on develop (fallback to master) to give sequential integers */
def getGitVersion() {
    def candidateRefs = [
        "develop", "origin/develop",
        "master", "origin/master"
    ]

    for (ref in candidateRefs) {
        try {
            def process = ["git", "rev-list", ref, "--first-parent", "--count"].execute()
            def out = process.text.trim()
            if (process.waitFor() == 0 && out.isInteger()) {
                return out.toInteger()
            }
        } catch (Exception ignored) {
        }
    }

    return 1
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "nl.sajansen.bloomablelogistics"
    defaultConfig {
        applicationId "nl.sajansen.bloomablelogistics"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getGitVersion()
        versionName getNpmVersion()

        setProperty("archivesBaseName", applicationId.replaceAll(/.*\./, "") + "-v" + versionCode + "(" + versionName + ")")
    }

    signingConfigs {
        debug {
            if (project.hasProperty('BLOOMABLE_UPLOAD_STORE_FILE')) {
                storeFile file(BLOOMABLE_UPLOAD_STORE_FILE)
                storePassword BLOOMABLE_UPLOAD_STORE_PASSWORD
                keyAlias BLOOMABLE_UPLOAD_KEY_ALIAS
                keyPassword BLOOMABLE_UPLOAD_KEY_PASSWORD
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (project.hasProperty('BLOOMABLE_UPLOAD_STORE_FILE')) {
                storeFile file(BLOOMABLE_UPLOAD_STORE_FILE)
                storePassword BLOOMABLE_UPLOAD_STORE_PASSWORD
                keyAlias BLOOMABLE_UPLOAD_KEY_ALIAS
                keyPassword BLOOMABLE_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation platform('com.google.firebase:firebase-bom:32.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
